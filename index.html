<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Кошелек</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <section id="auth-screen" class="screen">
            <div class="card login">
                <p class="big centered">Вход в систему</p>
                <input type="password" id="login-pass" placeholder="Пароль">
                <p id="auth-error" class="error hidden">Доступ запрещен</p>
                <button id="login-btn">Войти</button>
            </div>
        </section>

        <section id="main-screen" class="screen hidden">
            <header>
                <div class="header-row">
                    <p class="big">Личный кабинет</p>
                    <button id="logout-btn" class="btn-small">Выйти</button>
                </div>
                
                <div class="balance">
                    <p class="balance-label">Доступно</p>
                    <h1 id="balance-view">0 ₽</h1>
                </div>
            </header>

            <main>
                <div class="card transaction">
                    <p class="card-title">Управление финансами</p>
                    <input type="number" id="amount-input" placeholder="Введите сумму">
                    <select id="category-select"></select>
                    
                    <div class="row">
                        <button id="add-income" class="btn-plus">Доход</button>
                        <button id="add-expense" class="btn-minus">Расход</button>
                    </div>
                </div>

                <div class="card accordion">
                    <div class="settings-group">
                        <input type="text" id="new-cat-input" placeholder="Название категории">
                        <button id="add-cat-btn">Создать категорию</button>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="settings-group">
                        <input type="password" id="new-pass-input" placeholder="Новый пароль">
                        <button id="change-pass-btn">Обновить пароль</button>
                    </div>
                </div>

                <div class="card">
                    <p class="card-title">Последние операции</p>
                    
                    <div class="filters">
                        <button data-period="day" class="period active">День</button>
                        <button data-period="week" class="period">Неделя</button>
                        <button data-period="month" class="period">Месяц</button>
                    </div>

                    <div id="stats-list"></div>
                    <p class="advice" id="advice-box"></p>
                </div>
            </main>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
